name: W1™ Cognitive Defense Fortress CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  aerospace-verification:
    name: DO-178C Level A Formal Verification & Kernel CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Deterministic Unit Tests (145/145 Verification Suite)
        run: |
          npm test

      - name: Compile Native Linux C Kernel Controller
        run: |
          mkdir -p bin
          gcc -O3 -Wall -Wextra src/radar_machine_code/linux_kernel/w1_radar_ctl.c -lm -o bin/w1_radar_ctl_linux
          ls -lh bin/w1_radar_ctl_linux

      - name: Execute Native Radar Telemetry & Stealth Tracking
        run: |
          ./bin/w1_radar_ctl_linux telemetry
          ./bin/w1_radar_ctl_linux tracks

      - name: Run 100-Vector Comprehensive Cybersecurity Audit
        run: |
          node simulation/comprehensive_cybersecurity_audit.js
